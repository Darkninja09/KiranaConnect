spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/kiranaconnect}
      database: ${MONGODB_DATABASE:kiranaconnect}
  
kiranaconnect:
  app:
    jwtSecret: ${JWT_SECRET:KiranaConnectSecureSecretKey2026NewVersion}
    jwtExpirationMs: 86400000 # 24 hours
  razorpay:
    keyId: ${RAZORPAY_KEY_ID:}
    keySecret: ${RAZORPAY_KEY_SECRET:}
  google:
    search:
      apiKey: ${GOOGLE_SEARCH_API_KEY:}
      cxId: ${GOOGLE_SEARCH_CX_ID:}

server:
  port: ${PORT:8080}
